name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Firebase config from secrets or fallback demo
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          cat > js/firebase-config.js <<EOF
          export const firebaseConfig = {
            apiKey: "${FIREBASE_API_KEY:-DEMO_FIREBASE_API_KEY}",
            authDomain: "${FIREBASE_AUTH_DOMAIN:-becon-hvac-studio.firebaseapp.com}",
            projectId: "${FIREBASE_PROJECT_ID:-becon-hvac-studio}",
            storageBucket: "${FIREBASE_STORAGE_BUCKET:-becon-hvac-studio.appspot.com}",
            messagingSenderId: "${FIREBASE_MESSAGING_SENDER_ID:-123456789012}",
            appId: "${FIREBASE_APP_ID:-1:123456789012:web:abcdef123456}",
          };
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
