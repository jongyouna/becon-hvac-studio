<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Test Site 비밀번호 찾기</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-page">
    <header class="header">
      <div class="header__logo">
        <span class="logo-becon">test site</span>
      </div>
    </header>

    <main class="auth-content">
      <div class="auth-form">
        <h1 class="auth-title">비밀번호 찾기</h1>
        <p class="helper-text" style="margin-bottom: 24px;">
          계정(이메일)이 기억나지 않으면 가입 시 사용한 이메일로 로그인해주세요.
        </p>

        <form id="reset-password-form" novalidate>
          <div class="field">
            <label for="reset-email">이메일</label>
            <input type="email" id="reset-email" placeholder="가입한 이메일" autocomplete="off" />
          </div>
          <button type="submit" class="btn btn--primary">비밀번호 재설정 메일 보내기</button>
        </form>

        <p class="helper-text">
          <a href="index.html" class="link">로그인 화면으로 돌아가기</a>
        </p>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="js/find-account.js"></script>
</body>
</html>
