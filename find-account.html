<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BECON HVAC AI Studio - 비밀번호 재설정</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-page">
    <header class="header">
      <div class="header__logo">
        <span class="logo-becon">BECON</span>
        <span class="logo-cloud">HVAC AI Studio</span>
      </div>
    </header>

    <main class="auth-content">
      <form class="auth-form" id="find-form" novalidate>
        <h1 class="auth-title">비밀번호 찾기</h1>
        <p class="auth-subtitle">가입 시 등록한 엔지니어 이메일 주소를 입력하시면 비밀번호 재설정 링크를 보내드립니다.</p>

        <div class="field">
          <label for="account">가입 이메일</label>
          <input type="email" id="account" name="account" placeholder="engineer@building.com" autocomplete="off" />
        </div>

        <button type="submit" class="btn btn--primary">재설정 이메일 전송</button>

        <p class="helper-text">
          기억나셨나요?
          <a href="index.html" class="link">로그인으로 돌아가기</a>
        </p>
      </form>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="js/find-account.js"></script>
</body>
</html>
