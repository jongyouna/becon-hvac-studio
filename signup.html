<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BECON HVAC AI Studio - 엔지니어 회원가입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-page">
    <header class="header">
      <div class="header__logo">
        <span class="logo-becon" data-i18n="brand.name">BECON</span>
        <span class="logo-cloud" data-i18n="brand.sub">HVAC AI Studio</span>
      </div>

      <div class="header__user">
        <!-- 언어 선택 드롭다운 UI -->
        <div class="lang-dropdown" id="lang-dropdown">
          <button class="lang-select-btn" id="lang-select-btn" type="button" aria-label="Language Selector">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.8"/>
              <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" stroke="currentColor" stroke-width="1.8"/>
            </svg>
            <span id="current-lang-label">한국어</span>
            <svg width="10" height="6" viewBox="0 0 10 6" fill="none">
              <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
          </button>
          <div class="lang-dropdown-menu" id="lang-dropdown-menu">
            <button class="lang-option selected" data-lang="ko">🇰🇷 한국어 (Korean)</button>
            <button class="lang-option" data-lang="en">🇺🇸 English</button>
          </div>
        </div>
      </div>
    </header>

    <main class="auth-content">
      <form class="auth-form" id="signup-form" novalidate>
        <h1 class="auth-title" data-i18n="signup.title">엔지니어 계정 등록</h1>

        <div class="field">
          <label for="name" data-i18n="signup.name_label">엔지니어 성명</label>
          <input type="text" id="name" name="name" data-i18n-placeholder="signup.name_placeholder" placeholder="홍길동" autocomplete="off" />
        </div>

        <div class="field">
          <label for="account" data-i18n="signup.email_label">회사/엔지니어 이메일</label>
          <input type="email" id="account" name="account" data-i18n-placeholder="signup.email_placeholder" placeholder="engineer@building.com" autocomplete="off" />
        </div>

        <div class="field">
          <label for="password" data-i18n="signup.password_label">비밀번호</label>
          <input type="password" id="password" name="password" data-i18n-placeholder="signup.password_placeholder" placeholder="6자리 이상 비밀번호" autocomplete="off" />
        </div>

        <div class="field">
          <label for="password-confirm" data-i18n="signup.confirm_label">비밀번호 확인</label>
          <input type="password" id="password-confirm" name="password-confirm" data-i18n-placeholder="signup.confirm_placeholder" placeholder="비밀번호 재입력" autocomplete="off" />
        </div>

        <button type="submit" class="btn btn--primary" data-i18n="signup.btn_submit">계정 생성 완료</button>

        <p class="helper-text">
          <span data-i18n="signup.has_account">이미 계정이 있으신가요?</span>
          <a href="index.html" class="link" data-i18n="signup.link_login">로그인으로 이동</a>
        </p>
      </form>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="js/i18n.js"></script>
  <script type="module" src="js/signup.js"></script>
</body>
</html>
